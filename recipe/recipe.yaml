# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.52.0"
  env_d_json: selenium-manager.json

package:
  name: selenium-manager
  version: ${{ version }}

source:
  url: https://github.com/SeleniumHQ/selenium/archive/refs/tags/selenium-${{ version }}.tar.gz
  sha256: 3282451cad462cd5b7c941fbb71b8db1ace6d6ab160d2c90eed7c984068f4b1a

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    content:
      - if: unix
        then:
          - mkdir -p "${PREFIX}/etc/conda/env_vars.d"
          - |-
            cat > "${PREFIX}/etc/conda/env_vars.d/${{ env_d_json }}" << 'EOF'
            {"SE_MANAGER_PATH":"${PREFIX}/bin/selenium-manager"}
            EOF
        else:
          - mkdir %PREFIX%\etc\conda\env_vars.d
          - |-
            echo {"SE_MANAGER_PATH":"%PREFIX%\\Scripts\\selenium-manager.exe"} > "%PREFIX%\etc\conda\env_vars.d\${{ env_d_json }}"
      - if: osx
        then:
          - export RUSTFLAGS="-C link-args=-Wl,-rpath,${PREFIX}/lib"
      - if: linux
        then:
          - export RUSTFLAGS="-C link-arg=-Wl,-rpath-link,${PREFIX}/lib -L${PREFIX}/lib"
      - cd rust
      - cargo auditable install --locked --no-track --root=${{ PREFIX }} --path=.
      - cargo-bundle-licenses --format=yaml --output=THIRDPARTY.yml
      - cd "${{ RECIPE_DIR }}"
      - if: win
        then:
          - md "%SCRIPTS%" || echo "%SCRIPTS% already exists"
          - move "%PREFIX%\bin\selenium-manager.exe" "%SCRIPTS%"

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ compiler("rust") }}
    - ${{ stdlib("c") }}
    - cargo-auditable
    - cargo-bundle-licenses

tests:
  - package_contents:
      strict: true
      bin:
        - selenium-manager
      files:
        - etc/conda/env_vars.d/${{ env_d_json }}
  - script:
      - selenium-manager --version
      - selenium-manager --help
      - if: unix
        then: ls "${SE_MANAGER_PATH}"
        else: dir "%SE_MANAGER_PATH%"

about:
  homepage: https://github.com/SeleniumHQ/selenium
  license: Apache-2.0
  license_file:
    - rust/THIRDPARTY.yml
    - LICENSE
    - NOTICE
  summary: |-
    Selenium Manager is a standalone tool that automatically manages the browser
    infrastructure required by Selenium (i.e., browsers and drivers).

extra:
  recipe-maintainers:
    - conda-forge/selenium
    - bollwyvl
